name: yt-notifier

on:
  schedule:
    - cron: "2-59/5 * * * *"   # every 5 min (GitHub's minimum), off the busy :00 mark
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: yt-notifier
  cancel-in-progress: false     # never two runs at once pls

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check feeds once
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python3 bot.py --once

      - name: Save state
        if: always()
        run: |
          date -u +%G-W%V > DONT_DIE_PLS.txt   # changes weekly so GitHub never sees the repo as inactive
          git config user.name "Micro TV Reviver"
          git config user.email "Micro_TV_Reviver@users.noreply.github.com"
          git add DONT_DIE_PLS.txt
          [ -f state.json ] && git add state.json || true
          git diff --cached --quiet || (git commit -m "state" && git push)
